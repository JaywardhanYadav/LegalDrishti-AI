[project]
name = "legaldrishti-ai-backend"
version = "0.1.0"
description = "Backend services for LegalDrishti AI"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "flashrank>=0.2.0,<1",
    "httpx>=0.28,<1",
    "openai>=1.50,<2",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pypdf>=5.1,<6",
    "python-docx>=1.1,<2",
    "python-jose[cryptography]>=3.5,<4",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.43,<3",
    "structlog>=25,<26",
    "tavily-python>=0.5.0,<1",
    "uvicorn[standard]>=0.35,<1",
    "weaviate-client>=4.10,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
